[workspace]
members = ["crates/omni-md-plugin", "crates/omni-markdown-core"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["nilo vance"]
repository = "https://github.com/nilo-ggyt/omni-md"

[workspace.dependencies]
omni-plugin-sdk = { git = "https://github.com/nilo-ggyt/omni-plugin-sdk.git", rev = "f050d61ca88f5878c29b27fad74dca71eb2ca454", version = "=1.0.0" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
incompatible_msrv = "deny"

[profile.release]
codegen-units = 1
incremental = false
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
