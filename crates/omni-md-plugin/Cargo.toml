[package]
name = "omni-md-plugin"
version = "0.1.0"
description = "Native AppKit Markdown plugin for Omni Bar"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
default = ["native-markdown-runtime"]
native-markdown-runtime = ["omni-markdown-core/native-markdown-candidate"]
native-markdown-runtime-probe = ["native-markdown-runtime"]
native-input-trace = ["native-markdown-runtime"]

[dependencies]
omni-markdown-core = { path = "../omni-markdown-core", default-features = false }
omni-plugin-sdk.workspace = true
thiserror = "=2.0.20"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
dispatch2 = { version = "=0.3.1", default-features = false, features = ["block2", "objc2", "std"] }
core-foundation = "=0.10.1"
objc2 = { version = "=0.6.4", default-features = true }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
  "NSAlert",
  "NSApplication",
  "NSAppearance",
  "NSAttributedString",
  "NSBezierPath",
  "NSBox",
  "NSButton",
  "NSClipView",
  "NSColor",
  "NSComboBox",
  "NSControl",
  "NSEvent",
  "NSDragging",
  "NSFont",
  "NSFontDescriptor",
  "NSGraphics",
  "NSGraphicsContext",
  "NSLayoutManager",
  "NSMenu",
  "NSMenuItem",
  "NSPanel",
  "NSOpenPanel",
  "NSSavePanel",
  "NSTextFinder",
  "NSAccessibility",
  "NSAccessibilityProtocols",
  "NSPasteboard",
  "NSPasteboardItem",
  "NSParagraphStyle",
  "NSPopUpButton",
  "NSResponder",
  "NSRunningApplication",
  "NSRulerView",
  "NSTextElement",
  "NSScrollView",
  "NSStringDrawing",
  "NSText",
  "NSTextContainer",
  "NSTextContentManager",
  "NSTextField",
  "NSTextInputClient",
  "NSTextInputContext",
  "NSTextLayoutFragment",
  "NSTextLayoutManager",
  "NSTextViewportLayoutController",
  "NSTextRange",
  "NSTextSelection",
  "NSTextSelectionNavigation",
  "NSTextStorage",
  "NSTextTable",
  "NSTextView",
  "NSView",
  "NSWindow",
  "NSWorkspace",
  "block2",
  "objc2-core-foundation",
  "objc2-core-text",
  "std",
] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFRunLoop", "CFString", "block2", "objc2", "std"] }
objc2-core-text = { version = "=0.3.2", default-features = false, features = ["CTFont", "objc2", "std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "NSArray",
  "NSAttributedString",
  "NSCharacterSet",
  "NSDictionary",
  "NSGeometry",
  "NSNotification",
  "NSDate",
  "NSTimer",
  "block2",
  "NSPathUtilities",
  "NSRange",
  "NSString",
  "NSURL",
  "NSValue",
  "std",
] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "=3.27.0"

[[test]]
name = "native_textkit"
path = "tests/native_textkit.rs"
harness = false
required-features = ["native-markdown-runtime-probe"]
