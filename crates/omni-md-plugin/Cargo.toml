[package]
name = "omni-md-plugin"
version = "0.1.0"
description = "Native AppKit Markdown plugin for Omni Bar"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
# Source and preview share paged AppKit input and bounded sources; verification requires explicit features.
default = ["native-markdown-runtime", "native-table-row-append"]
# The native runtime selects bounded Core tables and preserves Foundation's real exception ABI.
native-markdown-runtime = ["omni-markdown-core/native-markdown-candidate", "omni-markdown-core/s2-table-window-prototype", "objc2/exception", "dep:libc", "native-paged-production"]
# Both product modes compose the same bounded paged graph, without enabling verification entry points.
native-paged-production = [
  "omni-markdown-core/paged-shaping",
  "omni-markdown-core/paged-scripts",
  "omni-markdown-core/paged-layout-breaks",
  "omni-markdown-core/paged-line-compose",
  "omni-markdown-core/paged-shaping-frontier",
  "objc2-core-text/CTFontDescriptor",
  "objc2-core-foundation/CFURL",
  "objc2-core-foundation/CFDictionary",
  "objc2-core-foundation/CFNumber",
  "objc2-core-graphics/CGFont",
  "objc2-app-kit/NSTextInputContext",
  "objc2-foundation/NSOperation",
  "dep:objc2-quartz-core",
  "objc2-app-kit/objc2-quartz-core",
  "objc2-core-graphics/CGBitmapContext",
  "objc2-core-graphics/CGColorSpace",
  "objc2-core-graphics/CGImage",
  "objc2-core-graphics/CGDataProvider",
]
# Add explicit native verification and observations; the product paged backend does not depend on them.
native-markdown-runtime-probe = [
  "native-markdown-runtime",
  "objc2-core-text/CTLine",
  "objc2-core-text/CTRun",
  "objc2-core-text/CTTypesetter",
  "objc2/exception",
  # Native gutter verification needs the real process clock, independent of dev-dependency feature unification.
  "objc2-foundation/NSProcessInfo",
  # Annotation verification temporarily owns a public text-checking controller and must invalidate it afterwards.
  "objc2-app-kit/NSTextCheckingController",
  "objc2-app-kit/NSTextCheckingClient",
  # Synthetic mouse verification observes one visible cell; product builds allocate no verification bitmap.
  "objc2-app-kit/NSBitmapImageRep",
  "objc2-app-kit/NSImageRep",
  # System composition reads the current input-method window metadata and posts local events to this app only.
  # Declare every required binding here rather than relying on standalone tests' dev dependencies.
  "objc2-app-kit/NSScreen",
  "objc2-app-kit/libc",
  "objc2-core-graphics/CGEvent",
  "objc2-core-graphics/CGEventTypes",
  "objc2-core-graphics/CGEventSource",
  "objc2-core-graphics/CGGeometry",
  "objc2-core-graphics/CGWindow",
  "objc2-core-graphics/CGWindowLevel",
  "objc2-core-graphics/CGRemoteOperation",
  "dep:libc",
]
# The independent raster comparison requires an explicit environment switch before allocating resources.
native-raster-surface-probe = [
  "native-markdown-runtime-probe",
  # TextKit raster comparison never replaces the product's single paged source graph.
  "dep:objc2-quartz-core",
  "objc2-app-kit/objc2-quartz-core",
  "objc2-foundation/NSOperation",
  "objc2-core-graphics/CGBitmapContext",
  "objc2-core-graphics/CGColorSpace",
  "objc2-core-graphics/CGDataProvider",
  "objc2-core-graphics/CGImage",
  "objc2-core-graphics/CGAffineTransform",
  "objc2-core-graphics/CGGeometry",
]
# Append at the actual table endpoint; its existing attributes and visible-window producer retain layout ownership.
native-table-row-append = ["native-markdown-runtime", "omni-markdown-core/s2-table-window-prototype"]
native-input-trace = ["native-markdown-runtime"]
native-table-edit-diagnostic = ["native-markdown-runtime"]
native-block-fragment-diagnostic = ["native-markdown-runtime"]
native-close-stage-diagnostic = ["native-markdown-runtime"]
# Observe native font provenance explicitly without replacing the editor graph or its font owners.
native-paged-font-probe = [
  "native-markdown-runtime",
  "omni-markdown-core/paged-shaping",
  "objc2-core-text/CTFontDescriptor",
  "objc2-core-foundation/CFURL",
  "objc2-core-foundation/CFDictionary",
  "objc2-core-foundation/CFNumber",
  "objc2-core-graphics/CGFont",
]
# Shape complete graphemes from the same source with actual candidate fonts, without replacing the editor.
native-paged-font-fallback-probe = [
  "native-paged-font-probe",
  "omni-markdown-core/paged-scripts",
  # Reuse native bindings to verify descriptor exhaustion and release, without another process or test package.
  "dep:libc",
]
# Add explicit paged-input/layout verification; native-paged-production owns the actual source capabilities.
native-paged-layout-probe = [
  "native-paged-font-probe",
  "omni-markdown-core/paged-layout-breaks",
  "dep:libc",
  # The paged NSView implements the public input protocol without constructing a whole-paragraph TextKit string.
  "objc2-app-kit/NSTextInputContext",
  "objc2-foundation/NSOperation",
  "dep:objc2-quartz-core",
  "objc2-app-kit/objc2-quartz-core",
  "objc2-core-graphics/CGBitmapContext",
  "objc2-core-graphics/CGColorSpace",
  "objc2-core-graphics/CGImage",
  "objc2-core-graphics/CGDataProvider",
]
# Find verification preserves actual input and visibility contracts; unfinished lines remain Pending.
native-paged-find-probe = [
  "native-paged-layout-probe",
]
# Native clients consume actual paged lines; partial preparation cannot stand in for a sealed LineEnd.
native-paged-compose-probe = [
  "native-paged-find-probe",
  "omni-markdown-core/paged-line-compose",
]
# One active line producer publishes incremental prefixes instead of substituting whole-paragraph output.
native-paged-frontier-probe = [
  "native-paged-compose-probe",
  "omni-markdown-core/paged-shaping-frontier",
]
# Verify the same paged body and font fallback explicitly; product source and preview already use this backend.
native-paged-body-probe = [
  "native-paged-frontier-probe",
  "native-paged-font-fallback-probe",
]
# Enable one-shot source-lease reclaim fault injection only for explicit synthetic-data acceptance probes.
native-source-reclaim-probe = [
  "native-paged-body-probe",
  "omni-markdown-core/original-backing-reclaim-probe",
]

[dependencies]
omni-markdown-core = { path = "../omni-markdown-core", default-features = false }
omni-plugin-sdk.workspace = true
thiserror = "=2.0.20"

[target.'cfg(target_os = "macos")'.dependencies]
# Explicit copy uses read-only output mappings and real munmap; diagnostics also need process metrics and bounded backtraces.
libc = { version = "=0.2.189", optional = true }
tempfile = "=3.27.0"
block2 = "=0.6.2"
dispatch2 = { version = "=0.3.1", default-features = false, features = ["block2", "objc2", "std"] }
core-foundation = "=0.10.1"
objc2 = { version = "=0.6.4", default-features = true }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
  "NSActionCell",
  "NSAlert",
  "NSApplication",
  "NSAppearance",
  "NSAttributedString",
  "NSBezierPath",
  "NSBox",
  "NSButton",
  "NSButtonCell",
  "NSClipView",
  "NSColor",
  "NSColorSpace",
  "NSComboBox",
  "NSComboBoxCell",
  "NSControl",
  "NSCell",
  "NSCursor",
  "NSEvent",
  "NSDragging",
  "NSFont",
  "NSFontManager",
  "NSFontDescriptor",
  "NSGraphics",
  "NSGraphicsContext",
  "NSGlyphInfo",
  "NSImage",
  "NSLayoutManager",
  "NSMenu",
  "NSMenuItem",
  "NSPanel",
  "NSOpenPanel",
  "NSSavePanel",
  "NSTextFinder",
  "NSAccessibility",
  "NSAccessibilityProtocols",
  "NSPasteboard",
  "NSPasteboardItem",
  "NSParagraphStyle",
  "NSPopUpButton",
  "NSResponder",
  "NSUserInterfaceValidation",
  "NSRunningApplication",
  "NSRulerView",
  "NSTextElement",
  "NSScrollView",
  "NSScroller",
  "NSTableView",
  "NSTableColumn",
  "NSTableHeaderView",
  "NSUserInterfaceItemIdentification",
  "NSStringDrawing",
  "NSText",
  "NSTextContainer",
  "NSTextContentManager",
  "NSTextField",
  "NSTextFieldCell",
  "NSTextInputClient",
  "NSTextInputContext",
  "NSTextLayoutFragment",
  "NSTextLayoutManager",
  "NSTextLineFragment",
  "NSTextViewportLayoutController",
  "NSTextRange",
  "NSTextSelection",
  "NSTextSelectionNavigation",
  "NSTextStorage",
  "NSTextTable",
  "NSTextView",
  "NSView",
  "NSWindow",
  "NSWorkspace",
  "block2",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "objc2-core-text",
  "std",
] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFRunLoop", "CFString", "block2", "objc2", "std"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGContext", "CGPath", "objc2", "std"] }
objc2-quartz-core = { version = "=0.3.2", optional = true, default-features = false, features = ["CALayer", "CATransaction", "objc2-core-graphics", "objc2-core-foundation", "std"] }
objc2-core-text = { version = "=0.3.2", default-features = false, features = ["CTFont", "CTFontTraits", "CTFrame", "CTFramesetter", "CTLine", "CTRun", "CTStringAttributes", "objc2", "objc2-core-graphics", "std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "NSArray",
  "NSAttributedString",
  "NSCharacterSet",
  "NSDictionary",
  "NSGeometry",
  "NSNotification",
  "NSDate",
  "NSDateFormatter",
  "NSTimer",
  "NSRunLoop",
  "NSUndoManager",
  "NSRegularExpression",
  "NSTextCheckingResult",
  "NSError",
  "block2",
  "NSPathUtilities",
  "NSRange",
  "NSString",
  "NSURL",
  "NSValue",
  "std",
] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
serde_json = "=1.0.151"
# 输入法验收只读实际屏幕与运行实例 PID；生产窗口不增加屏幕选择或进程扫描策略。
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSScreen", "libc"] }
# 原生属性用例借NSNull，输入事件以系统启动时钟记录真实创建时刻；仅测试图需要这两个绑定。
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSNull", "NSProcessInfo"] }
# 输入法验收构造带真实 CGEvent 的本地队列事件，只读原窗与组合面板元数据；不向系统投递按键或录屏。
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGWindow", "CGGeometry", "CGWindowLevel", "CGEvent", "CGEventTypes", "CGRemoteOperation"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFNumber"] }

