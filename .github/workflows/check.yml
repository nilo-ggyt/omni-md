name: Rust and native contracts

on:
  push:
  pull_request:

# Validation reads source only; pull-request jobs have no publication credentials.
permissions:
  contents: read

# Superseded branches do not consume a second native runner indefinitely.
concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-core:
    name: Portable document contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      RUSTDOCFLAGS: -D warnings
    steps:
      # Checkout v7.0.1 is pinned to its verified upstream release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install declared Linux compiler
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy --target x86_64-unknown-linux-gnu
      - name: Record compiler identity
        run: rustc +1.99.0 --version --verbose
      # An explicit target overrides the repository's macOS product default on this portable job.
      - name: Check minimal document configuration
        run: |
          cargo +1.99.0 clippy -p omni-markdown-core --all-targets --no-default-features --target x86_64-unknown-linux-gnu --locked -- -D warnings
          cargo +1.99.0 test -p omni-markdown-core --no-default-features --target x86_64-unknown-linux-gnu --locked
      - name: Check document parsing configuration
        run: |
          cargo +1.99.0 clippy -p omni-markdown-core --all-targets --all-features --target x86_64-unknown-linux-gnu --locked -- -D warnings
          cargo +1.99.0 test -p omni-markdown-core --all-features --target x86_64-unknown-linux-gnu --locked
          cargo +1.99.0 doc -p omni-markdown-core --all-features --no-deps --target x86_64-unknown-linux-gnu --locked
      # Portable library tests cover scalar tracing without compiling the AppKit test harness.
      - name: Check portable plugin and opt-in input trace
        run: |
          cargo +1.99.0 check -p omni-md-plugin --lib --target x86_64-unknown-linux-gnu --locked
          cargo +1.99.0 check -p omni-md-plugin --lib --tests --features native-input-trace --target x86_64-unknown-linux-gnu --locked
          cargo +1.99.0 test -p omni-md-plugin --lib --features native-input-trace --target x86_64-unknown-linux-gnu --locked

  native-contracts:
    name: AppKit contracts / Apple Silicon
    runs-on: macos-26
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install declared Apple Silicon compiler
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target aarch64-apple-darwin
      - name: Record compiler and runner identity
        run: |
          rustc +1.99.0 --version --verbose
          sw_vers
          uname -m
      - name: Check formatting and native diagnostics
        run: |
          cargo +1.99.0 fmt --all -- --check
          cargo +1.99.0 clippy --workspace --all-targets --locked -- -D warnings
          cargo +1.99.0 clippy --workspace --all-targets --features native-markdown-runtime-probe --locked -- -D warnings
      - name: Run library and public documentation contracts
        run: |
          cargo +1.99.0 test --workspace --lib --locked
          cargo +1.99.0 test --workspace --doc --locked
          cargo +1.99.0 doc --workspace --no-deps --locked
      # Trace has its own feature configuration; the runtime-probe build does not include it.
      - name: Check opt-in native input trace contracts
        run: |
          cargo +1.99.0 clippy -p omni-md-plugin --all-targets --features native-input-trace --locked -- -D warnings
          cargo +1.99.0 test -p omni-md-plugin --lib --features native-input-trace --locked
          cargo +1.99.0 doc -p omni-md-plugin --features native-input-trace --no-deps --locked
      # This requires actual native events and strict weak graph release; no GUI-unavailable skip.
      # Hosted-runner success does not replace M5 Max user-input/presentation acceptance.
      - name: Run real TextKit lifecycle contract
        run: cargo +1.99.0 test -p omni-md-plugin --release --test native_textkit --features native-markdown-runtime-probe --locked
